name: OmiLocal
options:
  bundleIdPrefix: com.omi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  OmiLocal:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omi.local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Omi needs Bluetooth to connect to your wearable device"
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Omi needs Bluetooth to connect to your wearable device"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Omi needs microphone access to record conversations"
        INFOPLIST_KEY_UIBackgroundModes: "audio bluetooth-central"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  OmiLocal:
    build:
      targets:
        OmiLocal: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
